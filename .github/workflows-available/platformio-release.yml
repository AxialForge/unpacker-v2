name: Build & Release (PlatformIO)

# ESP32 / PlatformIO firmware. Builds on every push, attaches the binaries to a
# GitHub Release on a version tag.
# Move this file to .github/workflows/ to activate it.
#
# Set ENVIRONMENT to the platformio.ini [env:...] name you actually ship.

env:
  ENVIRONMENT: esp32dev

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Caching both saves several minutes: ~/.platformio holds the toolchain
      # and framework, ~/.cache/pip holds PlatformIO Core itself.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ env.ENVIRONMENT }}

      # Flat, recognizable names — .pio/build/<env>/firmware.bin tells you
      # nothing once it's downloaded next to three other firmware.bin files.
      - name: Stage artifacts
        run: |
          mkdir -p out
          # Explicit `if`, not `[ -f ] && cp` — the runner's shell is `bash -e`,
          # and a false test as the last command in the loop body aborts the step.
          for f in firmware.bin firmware.elf partitions.bin bootloader.bin; do
            src=".pio/build/${ENVIRONMENT}/$f"
            if [ -f "$src" ]; then
              cp "$src" "out/${{ github.event.repository.name }}-${ENVIRONMENT}-${f}"
            fi
          done
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-firmware
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
