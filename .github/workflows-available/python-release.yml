name: Test & Release (Python)

# Python projects: tests on every push, a PyInstaller .exe on a version tag.
# Move this file to .github/workflows/ to activate it.
#
# Assumes a PyInstaller spec named after the repo (e.g. HomeInventory.spec).
# If the entry point is a bare script instead, replace the build step with:
#   pyinstaller --noconsole --onefile --name "<Name>" --clean <entry>.py

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  build-win:
    # Only on a tag, and only if the tests passed.
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: pyinstaller --noconfirm ${{ github.event.repository.name }}.spec

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows
          path: dist/*.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
